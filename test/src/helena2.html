<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>WayBread Watcher</title>
    <link rel="stylesheet" href="helena2.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>WayBread Watcher</h1>
        </header>
        <main>
            <section>
                <span>🍞</span>
                <h2>Mae Govannen, Gefährte!</h2>
                <p>Bitte authentifiziere dich für den Proviant.</p>
            </section>
            
            <section class="scanner-section">
                <img src="helena.png" alt="Scan">
                <p>Fingerabdruck-Scan</p>
            </section>
            
            <section>
                <h2>🔒 Status 🔒</h2>
                <p>Wartet auf Authentifizierung</p>
            </section>
            
            <section>
                <h2>👥 Hinweis</h2>
                <p>Neu hier? Registrierung nur durch Gefährten möglich</p>
            </section>
        </main>
    </div>
</body>
</html>
