<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>WayBread Watcher</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>WayBread Watcher</h1>
        </header>
        <main>
            <section class="welcome">
                <div class="app-logo">
                    <div class="inner-shape"></div>
                </div>
                <h2>Mae Govannen</h2>
                <p>Authentifizierung erforderlich</p>
            </section>
            
            <section class="scanner">
                <img src="helena.png" alt="Fingerabdruck">
                <h2>Fingerabdruck-Scan</h2>
            </section>
            
            <section class="status">
                <h2>🔒 Status 🔒</h2>
                <p>Bereit</p>
            </section>
            
            <section class="hint">
                <h2>👥 Hinweis</h2>
                <p>Nur für autorisierte Gefährten</p>
            </section>
        </main>
    </div>
</body>
</html>
