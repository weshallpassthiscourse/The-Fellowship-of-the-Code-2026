<<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="description" content="WayBread Watcher - Login für Gefährten" />
    <title>WayBread Watcher</title>
    <link rel="stylesheet" href="helena.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>WayBread Watcher</h1>
        </header>
        <main>
            <section class="welcome-section">
                <div class="icon">🍞</div>
                <h2>Mae govannen, Gefährte!</h2>
                <p>Bitte authentifiziere dich, um auf den Proviantbeutel zuzugreifen.</p>
            </section>
            
            <section class="scanner-section">
                <div class="scan-area">
                    <img src="helena.png" alt="Fingerabdruck" class="fingerprint-icon">
                    <span>Fingerabdruck-Scan</span>
                </div>
            </section>
            
            <section class="status-section">
                <span>🔒</span>
                <span>Status: Wartet auf Authentifizierung</span>
                <span>🔒</span>
            </section>
            
            <section class="hint-section">
                <h2>👥 Hinweis:</h2>
                <p>Neu hier? Registrierung nur durch einen autorisierten Gefährten möglich.</p>
            </section>
        </main>
    </div>
</body>
</html>
