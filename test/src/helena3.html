<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>WayBread Watcher</title>
    <link rel="stylesheet" href="helena3.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>WayBread Watcher</h1>
        </header>
        <main>
            <section class="welcome">
                <span>🍞</span>
                <h2>Mae Govannen, Gefährte!</h2>
                <p>Bitte authentifiziere dich, um den Proviantbeutel zu öffnen</p>
            </section>
            
            <section class="scanner">
                <img src="fingerabdruck.png" alt="Fingerabdruck">
                <p>Daumenabdruck scannen</p>
            </section>
            
            <section class="status">
                <h2>🔒 Status 🔒</h2>
                <p>Wartet auf Authentifizierung</p>
            </section>
            
            <section class="hint">
                <img src="info.png" alt="Infozeichen">
                <h2>Hinweis</h2>
                <p>Registrierung nur durch autorisierte Gefährten</p>
            </section>
        </main>
    </div>
</body>
</html>
