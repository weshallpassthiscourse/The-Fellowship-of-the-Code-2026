<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>WayBread Watcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <button class="btn-back" id="backBtn">← Zurück</button>
            <h1 id="headerTitle">PROFILE<br>VERWALTEN</h1>
        </header>
        
        <main>
            <!-- Liste -->
            <div id="screen-list" class="screen active">
                <button class="btn-top-action" id="goToAddBtn">Neues Profil hinzufügen</button>
                <div class="user-list-container scrollable">
                    <div class="user-list" id="fellowshipList">
                        <div class="loading-text">Gefährten werden aus Mittelerde gerufen...</div>
                    </div>
                </div>
            </div>

            <!-- Formular -->
            <div id="screen-form" class="screen form-screen scrollable">
                <div class="form-group">
                    <label>NAME:</label>
                    <input type="text" id="formName" placeholder="Name">
                </div>
                <div class="form-group">
                    <label>GESCHLECHT:</label>
                    <select id="formGender">
                        <option value="">-- Wählen --</option>
                        <option value="Männlich">Männlich</option>
                        <option value="Weiblich">Weiblich</option>
                        <option value="Unbekannt">Unbekannt</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>SPEZIES:</label>
                    <select id="formSpecies">
                        <option value="">-- Wählen --</option>
                        <option value="Hobbit">Hobbit</option>
                        <option value="Mensch">Mensch</option>
                        <option value="Zwerg">Zwerg</option>
                        <option value="Elb">Elb</option>
                        <option value="Maia">Maia</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>BEDARF PRO TAG:</label>
                    <input type="text" id="formRation" readonly placeholder="Wird berechnet">
                </div>
                
                <div class="form-group fingerprint-group">
                    <label>FINGERABDRUCK:</label>
                    <div class="fingerprint-box" id="formFingerprint">
                        <svg class="fp-icon" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4" />
                            <path d="M14 13.12c0 2.38 0 6.38-1 8.88" />
                            <path d="M17.29 21.02c.12-.6.43-2.3.5-3.02" />
                            <path d="M2 12a10 10 0 0 1 18-6" />
                            <path d="M2 16h.01" />
                            <path d="M21.8 16c.2-2 .131-5.354 0-6" />
                            <path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2" />
                            <path d="M8.65 22c.21-.66.45-1.32.57-2" />
                            <path d="M9 6.8a6 6 0 0 1 9 5.2v2" />
                        </svg>
                        <span id="fpText">Zum erfassen Finger anlegen</span>
                    </div>
                </div>
                
                <div class="btn-container">
                    <button class="btn btn-submit" id="saveUserBtn">PROFIL HINZUFÜGEN</button>
                </div>
            </div>

            <!-- Detail -->
            <div id="screen-detail" class="screen detail-screen">
                <div class="detail-info" id="detailInfo"></div>
                <div class="action-buttons">
                    <button class="btn btn-submit" id="editBtn">BEARBEITEN</button>
                    <button class="btn btn-delete" id="deleteBtn">LÖSCHEN</button>
                </div>
            </div>
        </main>

        <div id="toast" class="toast">Nachricht hier</div>

        <div id="modal" class="modal-overlay">
            <div class="modal-box">
                <h2 id="modalTitle"></h2>
                <p id="modalText"></p>
                <div class="modal-buttons">
                    <button class="btn btn-submit" id="modalYesBtn">Ja</button>
                    <button class="btn btn-delete" id="modalNoBtn">Nein</button>
                </div>
            </div>
        </div>

    </div>

    <script src="logic.js"></script>
</body>
</html>
